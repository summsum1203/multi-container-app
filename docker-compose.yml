version: '3.8'

services:
  api:
    build: ./app
    image: ${DOCKER_IMAGE:-todo-api}:${IMAGE_TAG:-latest}
    container_name: todo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/tododb
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    container_name: todo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mongo-data:
